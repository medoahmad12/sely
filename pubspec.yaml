name: sely_kids
description: SELY KIDS (سيلي كيدز) - an interactive, offline Arabic/English learning app for children aged 3-5.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  shared_preferences: ^2.3.0
  flutter_tts: ^4.2.0
  audioplayers: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/data/
    - assets/audio/ar/
    - assets/audio/en/
    - assets/audio/ui/
    - assets/audio/rewards/
    - assets/audio/music/
